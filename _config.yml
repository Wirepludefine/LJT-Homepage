# Basic Site Settings
locale: "en-US"
site_theme: "default" # options: "default", "air", "sunrise", "mint", "dirt", "contrast"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Junteng Liu's academic homepage"
url: https://wirepludefine.github.io
baseurl: "/LJT-Homepage"
repository: "Wirepludefine/LJT-Homepage"

# Site Author - blank fields do not appear in the sidebar
author:
  name: "Junteng Liu"
  bio: "First-year Ph.D. candidate in the HKUST NLP Group, advised by Prof. Junxian He. My research focuses on natural language processing and machine learning."
  location: "Hong Kong"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710" # X / Twitter username

# Publication categories and their headings
publication_category:
  preprints:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

# Site Settings
breadcrumbs: false # true, false (default)
words_per_minute: 160
future: true
read_more: "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link: false # change to true to add link to talkmap on talks page
atom_feed:
  hide: false # change to true to hide the RSS feed in the footer

# Social Sharing
twitter:
  username: &twitter
og_image:
og_description: "First-year Ph.D. candidate in the HKUST NLP Group, researching natural language processing and machine learning."

# Analytics
analytics:
  provider: "false" # false (default), "google", "google-universal", "google-analytics-4", "custom"

# Reading Files
include: [".htaccess", "_pages", "files"]
exclude: ["*.sublime-project", "*.sublime-workspace", ".asset-cache", ".bundle", ".github", ".jekyll-assets-cache", ".sass-cache", "assets/js/_main.js", "assets/js/plugins", "assets/js/vendor", "CHANGELOG", "Capfile", "config", "Dockerfile", "Gemfile", "Gruntfile.js", "gulpfile.js", "LICENSE", "local", "log", "node_modules", "package.json*", "Rakefile", "README", "tmp", "vendor"]
keep_files: [".git", ".svn"]

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# These settings control the types of collections used by the template
collections:
  teaching: {output: true, permalink: /:collection/:path/}
  publications: {output: true, permalink: /:collection/:path/}
  portfolio: {output: true, permalink: /:collection/:path/}
  talks: {output: true, permalink: /:collection/:path/}

# These settings control how pages and collections are included in the site
defaults:
  - {scope: {path: "", type: posts}, values: {layout: single, author_profile: true, read_time: true, comments: true, share: true, related: true}}
  - {scope: {path: "", type: pages}, values: {layout: single, author_profile: true}}
  - {scope: {path: "", type: teaching}, values: {layout: single, author_profile: true, share: true, comments: true}}
  - {scope: {path: "", type: publications}, values: {layout: single, author_profile: true, share: true, comments: true}}
  - {scope: {path: "", type: portfolio}, values: {layout: single, author_profile: true, share: true, comment: true}}
  - {scope: {path: "", type: talks}, values: {layout: talk, author_profile: true, share: true}}

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Plugins
plugins: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]

# Mimic GitHub Pages with --safe
whitelist: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
